<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O.C.E.A.N — Interactive Attribution Pipeline</title>
  <meta name="description"
    content="O.C.E.A.N interactive demo — upload satellite imagery, run AI detection, hydrodynamic hindcasting, and vessel attribution." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #000000;
      --surface: #050505;
      --card: #0a0a0a;
      --cyan: #00d4ff;
      --cyan-dim: rgba(0, 212, 255, 0.10);
      --magenta: #e040fb;
      --blue: #2979ff;
      --orange: #ff6d00;
      --teal: #2DD4BF;
      --teal-dim: rgba(45, 212, 191, 0.12);
      --alert: #FBBF24;
      --alert-dim: rgba(251, 191, 36, 0.12);
      --danger: #F87171;
      --green: #34D399;
      --text: #e8ecf0;
      --muted: #8a9bae;
      --dim: #475569;
      --dimmer: #334155;
      --border: rgba(255, 255, 255, 0.06);
      --border2: rgba(41, 121, 255, 0.25);
      --font-body: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--cyan);
      border-radius: 2px
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border)
    }

    .nav-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text)
    }

    .nav-logo-icon {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cyan-dim)
    }

    .nav-logo-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-d 1.5s ease-in-out infinite
    }

    @keyframes pulse-d {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .4;
        transform: scale(.7)
      }
    }

    .nav-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: .6rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--dim)
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .8rem;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all .25s
    }

    .nav-back:hover {
      color: var(--text);
      border-color: var(--magenta);
      border-bottom-color: var(--magenta)
    }

    .pipeline-bar {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px
    }

    .pipeline-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0
    }

    .pipe-step {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all .3s;
      position: relative
    }

    .pipe-step::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--dimmer);
      border-top: 1.5px solid var(--dimmer);
      transform: translateY(-50%) rotate(45deg);
      opacity: .4
    }

    .pipe-step:last-child::after {
      display: none
    }

    .pipe-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--dimmer);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: .6rem;
      font-weight: 600;
      color: var(--dimmer);
      transition: all .3s;
      flex-shrink: 0
    }

    .pipe-label {
      font-size: .72rem;
      font-weight: 500;
      color: var(--dimmer);
      transition: color .3s
    }

    .pipe-step.active .pipe-num {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(41, 121, 255, 0.12);
      box-shadow: 0 0 12px rgba(41, 121, 255, 0.3)
    }

    .pipe-step.active .pipe-label {
      color: var(--text)
    }

    .pipe-step.done .pipe-num {
      border-color: var(--green);
      color: var(--green);
      background: rgba(52, 211, 153, 0.1)
    }

    .pipe-step.done .pipe-label {
      color: var(--muted)
    }

    main {
      padding-top: 100px;
      min-height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 30px
    }

    .dashboard {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
      align-items: start
    }

    @media(min-width:960px) {
      .dashboard {
        grid-template-columns: 1.45fr 1fr
      }
    }

    .viewport {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #03070d;
      position: relative;
      height: 660px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6)
    }

    .viewport-hud {
      display: none
    }

    .viewport-mode {
      display: none
    }

    #viewportContent {
      width: 100%;
      height: 100%;
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden
    }

    .upload-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      width: 100%;
      height: 100%;
      text-align: center;
      overflow-y: auto
    }

    .upload-box {
      width: 100%;
      max-width: 380px;
      border: 2px dashed rgba(0, 212, 255, 0.2);
      border-radius: 14px;
      padding: 32px 24px;
      cursor: pointer;
      transition: all .3s;
      position: relative;
      overflow: hidden
    }

    .upload-box:hover {
      border-color: rgba(0, 212, 255, 0.5);
      background: rgba(0, 212, 255, 0.03)
    }

    .upload-box.dragover {
      border-color: var(--cyan);
      background: rgba(0, 212, 255, 0.06);
      transform: scale(1.02)
    }

    .upload-icon {
      margin: 0 auto 12px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--cyan-dim);
      border: 1px solid rgba(0, 212, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .upload-title {
      font-family: var(--font-display);
      font-size: .95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px
    }

    .upload-sub {
      font-size: .75rem;
      color: var(--muted);
      line-height: 1.4
    }

    .upload-or {
      color: var(--dimmer);
      font-size: .68rem;
      margin: 4px 0;
      font-family: var(--font-mono);
      letter-spacing: .1em
    }

    .sample-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 400px
    }

    @media(min-width:600px) {
      .sample-grid {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    .sample-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all .3s;
      background: var(--surface)
    }

    .sample-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px)
    }

    .sample-card.selected {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.2)
    }

    .sample-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block
    }

    .sample-card-label {
      padding: 4px 6px;
      font-size: .52rem;
      font-family: var(--font-mono);
      color: var(--dim);
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 22px;
      background: var(--blue);
      color: #fff;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: .82rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all .25s;
      margin-top: 8px
    }

    .btn-action:hover {
      background: #448aff;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(41, 121, 255, 0.3)
    }

    .btn-action:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none
    }

    .image-viewer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #03070d
    }

    .image-viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 8px
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 20px 4px rgba(0, 212, 255, 0.6), 0 0 60px 8px rgba(0, 212, 255, 0.2);
      z-index: 10;
      pointer-events: none;
      opacity: 0
    }

    .scan-line.scanning {
      animation: scan-down 2.5s ease-in-out infinite;
      opacity: 1
    }

    @keyframes scan-down {
      0% {
        top: 0;
        opacity: .6
      }

      50% {
        top: 100%;
        opacity: 1
      }

      51% {
        opacity: 0
      }

      100% {
        top: 0;
        opacity: 0
      }
    }

    .scan-grid {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(0, 212, 255, 0.04) 30px), repeating-linear-gradient(90deg, transparent, transparent 29px, rgba(0, 212, 255, 0.04) 30px);
      opacity: 0;
      transition: opacity .6s;
      z-index: 3;
      pointer-events: none
    }

    .scan-grid.active {
      opacity: 1
    }

    .mask-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity .8s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .mask-overlay.visible {
      opacity: 1
    }

    .mask-overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block
    }

    .detection-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(3, 7, 13, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 10px;
      padding: 8px 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: all .5s
    }

    .detection-badge.visible {
      opacity: 1;
      transform: translateY(0)
    }

    .map-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #03070d;
      overflow: hidden;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .map-container svg {
      width: 100%;
      height: 100%;
      display: block
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(.6);
        opacity: .8
      }

      100% {
        transform: scale(2.2);
        opacity: 0
      }
    }

    .pr {
      animation: pulse-ring 2.4s cubic-bezier(.4, 0, .6, 1) infinite
    }

    .analysis-panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(8, 17, 30, 0.85);
      backdrop-filter: blur(12px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 660px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6)
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      flex-shrink: 0
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: .6rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(0, 212, 255, 0.8)
    }

    .panel-version {
      font-family: var(--font-mono);
      font-size: .55rem;
      color: var(--dimmer)
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px
    }

    .log-line {
      display: flex;
      gap: 10px;
      padding: 4px 0;
      animation: fadeUp .4s ease both
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .log-time {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: .6rem;
      color: var(--dimmer);
      min-width: 48px
    }

    .log-msg {
      font-size: .74rem;
      line-height: 1.6;
      color: var(--muted)
    }

    .log-msg.good {
      color: var(--green)
    }

    .log-msg.warn {
      color: var(--alert)
    }

    .log-msg.info {
      color: var(--cyan)
    }

    .log-msg.err {
      color: var(--danger)
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 12px 0
    }

    .stat-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 12px;
      text-align: center
    }

    .stat-val {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text)
    }

    .stat-lbl {
      font-size: .62rem;
      color: var(--dim);
      margin-top: 2px;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-family: var(--font-mono)
    }

    .check-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 10px 0
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 7px 12px;
      animation: fadeUp .4s ease both
    }

    .check-name {
      font-size: .72rem;
      color: var(--muted)
    }

    .check-pass {
      color: var(--green)
    }

    .check-fail {
      color: var(--dimmer)
    }

    .progress-block {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 14px;
      margin: 12px 0
    }

    .pb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .pb-label {
      font-family: var(--font-mono);
      font-size: .58rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dimmer)
    }

    .pb-value {
      font-family: var(--font-mono);
      font-size: .76rem;
      color: var(--cyan)
    }

    .pb-track {
      height: 6px;
      background: rgba(0, 212, 255, 0.08);
      border-radius: 3px;
      overflow: hidden
    }

    .pb-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--alert));
      border-radius: 3px;
      width: 0%;
      transition: width 1.5s ease
    }

    .vessel-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 12px;
      margin-bottom: 8px;
      animation: fadeUp .4s ease both
    }

    .vessel-header {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .vessel-name {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text)
    }

    .vessel-type {
      font-size: .62rem;
      color: var(--dim);
      font-family: var(--font-mono)
    }

    .score-pill {
      border-radius: 100px;
      padding: 3px 12px;
      font-family: var(--font-mono);
      font-size: .72rem;
      font-weight: 600
    }

    .sp-high {
      border: 1px solid rgba(251, 191, 36, .4);
      background: var(--alert-dim);
      color: var(--alert)
    }

    .sp-mid {
      border: 1px solid rgba(0, 212, 255, .3);
      background: var(--cyan-dim);
      color: var(--cyan)
    }

    .sp-low {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--dim)
    }

    .vessel-factors {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: .55rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dimmer)
    }

    .f-flag {
      color: var(--alert)
    }

    .evidence-card {
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 12px;
      background: var(--surface);
      padding: 16px;
      margin: 12px 0
    }

    .ev-title {
      font-family: var(--font-mono);
      font-size: .58rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(0, 212, 255, 0.7);
      margin-bottom: 10px
    }

    .ev-suspect-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px
    }

    .ev-imo {
      font-family: var(--font-mono);
      font-size: .68rem;
      color: var(--dim)
    }

    .ev-table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 6px 8px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid rgba(0, 212, 255, 0.12);
      font-family: var(--font-mono);
      font-size: .54rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(0, 212, 255, 0.65);
      margin-top: 8px;
    }

    .ev-th-right {
      text-align: right;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ev-rows {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ev-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(0, 212, 255, 0.02);
      border: 1px solid rgba(0, 212, 255, 0.07);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .ev-row:hover {
      background: rgba(0, 212, 255, 0.05);
      border-color: rgba(0, 212, 255, 0.2);
    }

    .ev-col-left {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ev-factor-head {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ev-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--alert);
      box-shadow: 0 0 6px rgba(251, 191, 36, 0.7);
      flex-shrink: 0;
    }

    .ev-code {
      font-family: var(--font-mono);
      font-size: .72rem;
      font-weight: 700;
      color: #fff;
    }

    .ev-desc {
      font-size: .70rem;
      color: var(--dim);
    }

    .ev-wt-badge {
      font-family: var(--font-mono);

      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    function calculateVesselVSI(vessel, origLon, origLat) {
      var distKm = (typeof vessel.dist === 'number') ? Math.max(0.05, vessel.dist) : 15.0;
      // F_loc (40% weight): exp(-d^2 / (2 * sigma^2)), sigma = 2.5 km [PRD §30.1]
      var f_loc = Math.exp(-(distKm * distKm) / (2 * 2.5 * 2.5));

      // F_spd (25% weight): max(0, (v_nom - v_orig) / v_nom) [PRD §30.2]
      var v_nom = vessel.nominal_speed || (vessel.culprit ? 14.5 : (vessel.type === "Container ship" ? 18.2 : 13.0));
      var v_orig = vessel.origin_speed || (vessel.culprit ? 3.1 : (vessel.slowed ? 8.5 : v_nom));
      var f_spd = Math.max(0, Math.min(1, (v_nom - v_orig) / v_nom));

      // F_gap (25% weight): intentional dark evasion = 1.0, otherwise gap_hours / 1.0 [PRD §30.3]
      var has_dark = Boolean(vessel.dark);
      var f_gap = has_dark ? 1.0 : (vessel.gap_hours ? Math.min(1, vessel.gap_hours / 1.0) : 0.0);

      // F_prof (10% weight): vessel type risk lookup table [PRD §30.4]
      var typeTable = {
        'crude': 0.95, 'product': 0.85, 'chemical': 0.80, 'bulk': 0.50,
        'container': 0.25, 'cargo': 0.30, 'fishing': 0.15, 'trawler': 0.15
      };
      var tLower = (vessel.type || '').toLowerCase();
      var f_prof = 0.20;
      for (var k in typeTable) {
        if (tLower.indexOf(k) !== -1) { f_prof = typeTable[k]; break; }
      }

      var c_loc = 0.40 * f_loc * 100;
      var c_spd = 0.25 * f_spd * 100;
      var c_gap = 0.25 * f_gap * 100;
      var c_prof = 0.10 * f_prof * 100;
      var total = Math.round((c_loc + c_spd + c_gap + c_prof) * 1000) / 1000;
      var totalStr = total.toFixed(3);

      var factors = [
        {
          factor: 'F_loc — Distance to origin',
          observation: distKm.toFixed(3) + ' km (geodesic minimum)',
          weight: '40%',
          contribution: c_loc.toFixed(3) + ' / 40.000 pts (F=' + f_loc.toFixed(4) + ')'
        },
        {
          factor: 'F_spd — Speed anomaly',
          observation: 'Slowed ' + v_nom.toFixed(1) + ' → ' + v_orig.toFixed(1) + ' kn (' + (f_spd * 100).toFixed(1) + '% drop)',
          weight: '25%',
          contribution: c_spd.toFixed(3) + ' / 25.000 pts (F=' + f_spd.toFixed(4) + ')'
        },
        {
          factor: 'F_gap — AIS evasion',
          observation: has_dark ? 'Dark transponder shutdown event' : (vessel.gap_hours ? vessel.gap_hours + 'h transmission gap' : 'AIS active, continuous feed'),
          weight: '25%',
          contribution: c_gap.toFixed(3) + ' / 25.000 pts (F=' + f_gap.toFixed(4) + ')'
        },
        {
          factor: 'F_prof — Vessel profile',
          observation: vessel.type + ' (risk prior ' + f_prof.toFixed(2) + ')',
          weight: '10%',
          contribution: c_prof.toFixed(3) + ' / 10.000 pts (F=' + f_prof.toFixed(4) + ')'
        }
      ];

      return {
        score: totalStr,
        scoreExact: total,
        f_loc: f_loc,
        f_spd: f_spd,
        f_gap: f_gap,
        f_prof: f_prof,
        factors: factors
      };
    }

    function recalibrateVesselsFromHindcast(originData) {
      var origLon = 73.743, origLat = 17.561;
      if (originData && originData.features) {
        var bestEst = originData.features.find(function (f) {
          return f.properties && f.properties.probability_band === 'best_estimate';
        });
        if (bestEst && bestEst.geometry && bestEst.geometry.coordinates) {
          origLon = bestEst.geometry.coordinates[0];
          origLat = bestEst.geometry.coordinates[1];
        }
      }

      // If culprit vessel, align its T=-18h intercept waypoint with simulated slick position
      // plus slight natural physical dispersion
      if (originData && originData.properties && originData.properties.trajectory) {
        var s18 = getSlickStateAtTime(-18.0).pos;
        var pSeed = Math.abs(Math.sin(origLon * 10.0 + origLat * 5.0));
        var latOffset = (pSeed * 0.005) - 0.0025; // ~0.2 to 0.5 km
        var lonOffset = ((1.0 - pSeed) * 0.005) - 0.0025;
        var interceptCoord = [s18[0] + lonOffset, s18[1] + latOffset];

        var cVessel = TIMELINE_VESSELS.find(function(item) { return item.culprit; });
        if (cVessel && cVessel.waypoints) {
          cVessel.waypoints.forEach(function(w) {
            if (Math.abs(w.t - (-18.0)) < 0.2) {
              w.pos = interceptCoord;
            }
          });
        }
      }

      VESSELS = TIMELINE_VESSELS.map(function (tv) {
        var minD = 9999.0;
        var spdAtMin = tv.nominal_speed || 14.5;

        tv.waypoints.forEach(function (w) {
          var wGeo = tacticalToGeo(w.pos);
          var slickAtT = getSlickStateAtTime(w.t);
          var d = haversineDistKm(wGeo[0], wGeo[1], slickAtT.pos[0], slickAtT.pos[1]);
          if (d < minD) {
            minD = d;
            spdAtMin = w.speed;
          }
        });

        var distKm = Math.round(minD * 100) / 100;
        var nomSpd = tv.culprit ? 14.5 : (tv.id === 'v2' ? 18.2 : (tv.id === 'v4' ? 13.0 : (tv.id === 'v3' ? 12.0 : 7.0)));

        var vCopy = {
          id: tv.id,
          name: tv.name,
          imo: tv.imo,
          type: tv.type,
          typeRisk: tv.typeRisk,
          pos: tv.waypoints[tv.waypoints.length - 1].pos,
          dist: distKm,
          slowed: spdAtMin < nomSpd * 0.75,
          dark: Boolean(tv.culprit || tv.waypoints.some(function (w) { return w.dark; })),
          culprit: Boolean(tv.culprit),
          track: tv.waypoints.map(function (w) { return w.pos; }),
          nominal_speed: nomSpd,
          origin_speed: spdAtMin,
          gap_hours: tv.culprit ? 1.0 : (tv.id === 'v3' ? 0.4 : 0.0)
        };
        var vsiRes = calculateVesselVSI(vCopy, origLon, origLat);
        vCopy.score = vsiRes.score;
        vCopy.scoreExact = vsiRes.scoreExact;
        vCopy.f_loc = vsiRes.f_loc;
        vCopy.f_spd = vsiRes.f_spd;
        vCopy.f_gap = vsiRes.f_gap;
        vCopy.f_prof = vsiRes.f_prof;
        vCopy.factors = vsiRes.factors;
        return vCopy;
      });

      // Sort vessels descending by VSI score
      VESSELS.sort(function (a, b) { return b.scoreExact - a.scoreExact; });
    }

    var defaultVsiResults = null;
    var VESSELS = TIMELINE_VESSELS.map(function (tv) {
      var dist = tv.culprit ? 0.35 : (tv.id === 'v4' ? 11.8 : (tv.id === 'v3' ? 16.4 : (tv.id === 'v2' ? 21.1 : 26.2)));
      var nomSpd = tv.culprit ? 14.5 : (tv.id === 'v2' ? 18.2 : (tv.id === 'v4' ? 13.0 : (tv.id === 'v3' ? 12.0 : 7.0)));
      var origSpd = tv.culprit ? 3.1 : (tv.id === 'v4' ? 8.5 : (tv.id === 'v3' ? 11.8 : (tv.id === 'v2' ? 18.2 : 7.0)));

      var vInit = {
        id: tv.id,
        name: tv.name,
        imo: tv.imo,
        type: tv.type,
        typeRisk: tv.typeRisk,
        pos: tv.waypoints[tv.waypoints.length - 1].pos,
        dist: dist,
        slowed: tv.culprit || tv.id === 'v4',
        dark: Boolean(tv.culprit),
        culprit: Boolean(tv.culprit),
        track: tv.waypoints.map(function (w) { return w.pos; }),
        nominal_speed: nomSpd,
        origin_speed: origSpd,
        gap_hours: tv.culprit ? 1.0 : (tv.id === 'v3' ? 0.4 : 0.0)
      };
      var vsiRes = calculateVesselVSI(vInit, 73.145, 17.442);
      vInit.score = vsiRes.score;
      vInit.scoreExact = vsiRes.scoreExact;
      vInit.f_loc = vsiRes.f_loc;
      vInit.f_spd = vsiRes.f_spd;
      vInit.f_gap = vsiRes.f_gap;
      vInit.f_prof = vsiRes.f_prof;
      vInit.factors = vsiRes.factors;
      return vInit;
    });
    VESSELS.sort(function (a, b) { return b.scoreExact - a.scoreExact; });

    function $(id) { return document.getElementById(id); }

    function updatePipeline() {
      document.querySelectorAll('.pipe-step').forEach(function (el, i) {
        el.classList.remove('active', 'done');
        el.style.cursor = 'pointer';
        el.onclick = function () { goToPhase(i); };
        if (i < phase) el.classList.add('done');
        else if (i === phase) el.classList.add('active');
      });
    }

    function goToPhase(targetPhase) {
      phase = targetPhase;
      updatePipeline();
      var dock = $('hindcastTimelineDock');
      if (phase === 0) {
        if (dock) dock.style.display = 'none';
        renderSelect();
      } else if (phase === 1) {
        if (dock) dock.style.display = 'none';
        runDetectionPhase();
      } else if (phase === 2) {
        runHindcastPhase();
      } else if (phase === 3) {
        runAttributionPhase();
      }
    }

    function render() {
      updatePipeline();
      if (phase === 0) renderSelect();
    }

    /* ══════════════════════════════════════════════════
       PHASE 0 — SELECT IMAGE

        'Analyze &amp; Run Full Pipeline' +

      $('panelBody').innerHTML = logHTML('SYS', 'O.C.E.A.N. Attribution Pipeline initialized') +
        logHTML('SYS', 'Select an <strong>Oil Spill</strong> image to begin the full pipeline.') +
        logHTML('SYS', 'The system will automatically: Detect → Hindcast → Attribute');

      // Setup upload handlers
      var box = $('uploadBox');
      box.onclick = function () { $('fileInput').click(); };
      box.ondragover = function (e) { e.preventDefault(); box.classList.add('dragover'); };
      box.ondragleave = function () { box.classList.remove('dragover'); };
      box.ondrop = function (e) {
        e.preventDefault(); box.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]);
      };
      $('fileInput').onchange = function (e) {
        if (e.target.files.length > 0) handleFileUpload(e.target.files[0]);
      };

      // Load sample images — prioritize OIL SPILL samples
      fetch('/api/samples').then(function (r) { return r.json(); }).then(function (samples) {
        // Show Oil Spill samples first
        var oilFirst = samples.filter(function (s) { return s.cls === 'Class_1'; })
          .concat(samples.filter(function (s) { return s.cls === 'Class_0'; }));

        var grid = $('sampleGrid');
        grid.innerHTML = '';
        oilFirst.forEach(function (s, idx) {
          var card = document.createElement('div');
          card.className = 'sample-card';
          card.innerHTML = '<img src="/' + s.path + '" alt="' + s.name + '"/><div class="sample-card-label">' + s.label + '</div>';
          card.onclick = function () {
            document.querySelectorAll('.sample-card').forEach(function (c) { c.classList.remove('selected'); });
            card.classList.add('selected');
            selectedImagePath = s.path;
            selectedImageUrl = '/' + s.path;
            window._uploadedFile = null;
            $('analyzeBtn').disabled = false;
            // Fix stale label: if we're beyond phase 0, reset back so old image doesn't linger
            if (phase > 0) {
              phase = 0;
              updatePipeline();
              var dock = $('hindcastTimelineDock');
              if (dock) dock.style.display = 'none';
              renderSelect();
              // Re-select this card after re-render
              setTimeout(function () {
                document.querySelectorAll('.sample-card').forEach(function (c2) {
                  var img = c2.querySelector('img');
                  if (img && img.src.indexOf(s.path) !== -1) {
                    c2.classList.add('selected');

                });
              }, 200);
              return;
            }
            addLog('IMG', 'Selected: ' + s.name + ' (' + s.label + ')', 'info');
          };
          grid.appendChild(card);

          // Auto-select the first Oil Spill image
          if (idx === 0 && s.cls === 'Class_1') {
            card.classList.add('selected');
            selectedImagePath = s.path;
            selectedImageUrl = '/' + s.path;
            $('analyzeBtn').disabled = false;
          }
        });
      }).catch(function () {
        $('sampleGrid').innerHTML = '<div style="color:var(--dim);font-size:.72rem;grid-column:1/-1;text-align:center;padding:12px">Could not load samples</div>';
      });
    }

    function handleFileUpload(file) {
      selectedImageUrl = URL.createObjectURL(file);
      selectedImagePath = null;
      window._uploadedFile = file;
      document.querySelectorAll('.sample-card').forEach(function (c) { c.classList.remove('selected'); });
      $('analyzeBtn').disabled = false;
      addLog('IMG', 'Uploaded: ' + file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)', 'info');
      var box = $('uploadBox');
      box.innerHTML = '<img src="' + selectedImageUrl + '" style="max-width:100%;max-height:200px;border-radius:8px;"/><div class="upload-sub" style="margin-top:8px">' + file.name + '</div>';
    }

    /* ══════════════════════════════════════════════════
       LAUNCH FULL PIPELINE — automatic flow
       ══════════════════════════════════════════════════ */

    function launchFullPipeline() {
      // Disable button
      var btn = $('analyzeBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Running pipeline...'; }

      // Phase 1: Detection
      phase = 1;
      runDetectionPhase();
    }

    /* ══════════════════════════════════════════════════
       PHASE 1 — AI DETECTION
       ══════════════════════════════════════════════════ */

    function runDetectionPhase() {
      updatePipeline();
      $('viewportMode').textContent = 'SAR SCAN';

      var imgSrc = selectedImageUrl || '/iSIH_dataset/data/Class_1/class_1_00001.jpg';
      $('viewportContent').innerHTML =
        '<div class="image-viewer">' +
        '<div style="position:absolute;top:12px;left:14px;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.12em;color:rgba(0,212,255,0.6);z-index:10;display:flex;align-items:center;gap:6px">' +
        '<span style="width:6px;height:6px;border-radius:50%;background:var(--cyan);display:inline-block;animation:pulse-ring 2s infinite"></span>' +
        'SAR SATELLITE RECON // SENTINEL-1 C-BAND (10m RESOLUTION)' +
        '</div>' +
        '<img id="satImage" src="' + imgSrc + '" style="width:100%;height:100%;object-fit:contain"/>' +
        '<div class="scan-grid" id="scanGrid"></div>' +
        '<div class="scan-line" id="scanLine"></div>' +
        '<div class="mask-overlay" id="maskOverlay"><img id="maskImg"/></div>' +
        '<div class="detection-badge" id="detBadge">' +
        '<div style="width:8px;height:8px;border-radius:50%;background:var(--alert);animation:pulse-d 1s ease infinite"></div>' +
        '<span style="font-family:var(--font-mono);font-size:.68rem;font-weight:500;color:var(--alert)" id="detBadgeText">OIL SPILL DETECTED</span>' +
        '</div>' +
        '</div>';

      $('panelBody').innerHTML = '';
      addLog('03:12Z', 'Satellite image received — processing...');

      setTimeout(function () {
        $('scanGrid').classList.add('active');
        $('scanLine').classList.add('scanning');
        addLog('03:13Z', 'Initializing SAR segmentation model (U-Net + ResNet backbone)...');
      }, 400);

      setTimeout(function () {
        addLog('03:14Z', 'Running pixel-level semantic segmentation (5 classes)...');
      }, 1000);

      // Call backend
      setTimeout(function () { callDetectionAPI(); }, 1400);
    }

    function callDetectionAPI() {
      addLog('03:15Z', 'Sending to AI engine...', 'info');
      // Show processing loader
      $('panelBody').innerHTML += '<div class="processing-loader" id="detectionLoader"><div class="loader-spinner"></div><div class="loader-text">Running AI segmentation model...</div></div>';

      var fetchOpts;
      if (window._uploadedFile) {
        var fd = new FormData();
        fd.append('image', window._uploadedFile);
        fetchOpts = { method: 'POST', body: fd };
      } else {
        fetchOpts = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sample_path: selectedImagePath })
        };
      }

      fetch('/api/detect', fetchOpts).then(function (r) { return r.json(); }).then(function (data) {
        if (data.status === 'error') {
          addLog('ERR', data.message, 'err');
          return;
        }

        analysisData = data.analysis || {};
        window.spillGeojson = data.geojson;
        if (data.geojson && data.geojson.features && data.geojson.features.length > 0) {
          var pts = [];
          function walkG(c) {
            if (Array.isArray(c)) {
              if (c.length >= 2 && typeof c[0] === 'number') pts.push([c[0], c[1]]);
              else c.forEach(walkG);
            }
          }
          walkG(data.geojson.features[0].geometry.coordinates);
          if (pts.length > 2) window.realSlickPolygon = pts;
        }
        var sl = $('scanLine');
        if (sl) sl.classList.remove('scanning');
        // Remove processing loader
        var loader = $('detectionLoader');
        if (loader) loader.remove();

        addLog('03:18Z', 'Segmentation complete — classifying anomaly...');

        // Look-alike checks
        setTimeout(function () {
          var isOil = analysisData.detection === 'oil_spill' && analysisData.confidence > 10;
          var checks = [
            ['Algae bloom', 'ruled'], ['Rain cell / wind shadow', 'ruled'],
            ['Low-wind calm patch', 'ruled'], ['Natural seep', 'ruled'],
            ['Mineral oil — crude', isOil ? 'match' : 'ruled']
          ];
          var html = '<div class="check-list">';
          checks.forEach(function (c, i) {
            var m = c[1] === 'match';
            html += '<div class="check-item" style="animation-delay:' + i * 0.12 + 's"><span class="check-name">' + c[0] +
              '</span><span style="font-size:.68rem;font-weight:500" class="' + (m ? 'check-pass' : 'check-fail') + '">' + (m ? '&#10003; Match' : '&#10005; Ruled out') + '</span></div>';
          });
          html += '</div>';
          $('panelBody').innerHTML += html;
        }, 400);

        // Show mask overlay
        setTimeout(function () {
          var mo = $('maskOverlay'); var mi = $('maskImg');
          if (mo && mi && data.mask_url) {
            mi.src = data.mask_url;
            mi.style.cssText = 'width:100%;height:100%;object-fit:contain; border-radius: 8px; border: 1.5px solid rgba(0,212,255,0.4); box-shadow: 0 0 25px rgba(0,212,255,0.25);';
            var origImg = $('satImage');
            if (origImg) origImg.style.display = 'none';

            var header = document.getElementById('sarHeaderTag');
            if (!header) {
              var tag = document.createElement('div');
              tag.id = 'sarHeaderTag';
              tag.style.cssText = 'position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-around;font-family:var(--font-mono);font-size:.62rem;color:var(--cyan);letter-spacing:.08em;background:rgba(3,7,13,0.85);backdrop-filter:blur(8px);padding:6px 12px;border-radius:6px;border:1px solid rgba(0,212,255,0.25);z-index:15;animation:fadeUp .4s ease both';
              tag.innerHTML = '<span>[1] SATELLITE SAR</span><span>[2] GROUND TRUTH</span><span>[3] AI OIL SEGMENTATION</span>';
              $('viewportContent').appendChild(tag);
            }
            mo.classList.add('visible');
          } else if (mo && mi && data.overlay_url) {
            mi.src = data.overlay_url;
            mi.style.cssText = 'width:100%;height:100%;object-fit:contain';
            mo.classList.add('visible');
          }
        }, 1400);

        // Show stats and decide next step
        setTimeout(function () {
          var a = analysisData;
          var isOil = a.detection === 'oil_spill' && a.confidence > 10;

          var methodLabel = a.detection_method || 'AI Segmentation';
          // Shorten for display
          if (methodLabel.length > 30) methodLabel = methodLabel.substring(0, 28) + '…';

          addLog('03:19Z', 'Classification confidence: ' + (a.confidence || 0) + '%', isOil ? 'good' : 'warn');
          if (a.detection_method && a.detection_method !== 'N/A') {
            addLog('03:19Z', 'Method: ' + a.detection_method, 'info');
          }

          var confidenceColor = (a.confidence >= 70) ? 'var(--green)' : (a.confidence >= 40) ? 'var(--alert)' : 'var(--muted)';

          var html = '<div class="stat-row">' +
            '<div class="stat-card"><div class="stat-val" style="color:' + confidenceColor + '">' + (a.confidence || 0) + '%</div><div class="stat-lbl">Confidence</div></div>' +
            '<div class="stat-card"><div class="stat-val">' + (a.oil_percentage || 0) + '%</div><div class="stat-lbl">Oil Coverage</div></div>' +
            '<div class="stat-card"><div class="stat-val">' + (a.area_km2 || '—') + '</div><div class="stat-lbl">Est. Area km²</div></div>' +
            '<div class="stat-card"><div class="stat-val">' + (a.oil_pixels || 0) + '</div><div class="stat-lbl">Detected Px</div></div>' +
            '</div>';

          if (isOil) {
            html += '<div style="margin-top:8px;padding:6px 10px;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);border-radius:6px;font-size:.62rem;color:var(--muted)">' +
              '<span style="color:var(--dim);letter-spacing:.08em;font-size:.56rem">AI METHOD: </span>' + methodLabel +
              '</div>';
          }

          $('panelBody').innerHTML += html;

          // Show detection badge
          var badge = $('detBadge');
          if (badge) {
            if (isOil) {
              badge.classList.add('visible');
            } else {
              $('detBadgeText').textContent = 'NO OIL DETECTED';
              $('detBadgeText').style.color = 'var(--green)';
              badge.querySelector('div').style.background = 'var(--green)';
              badge.style.borderColor = 'rgba(52,211,153,0.3)';
              badge.classList.add('visible');
            }
          }

          if (isOil) {
            addLog('03:20Z', 'OIL SPILL CONFIRMED — auto-proceeding to hindcast...', 'warn');

    function updateGeoBoundsFromData(originData, spillGeojson) {
      var lons = [], lats = [];
      function addPoint(pt) {
        if (Array.isArray(pt) && pt.length >= 2 && !isNaN(pt[0]) && !isNaN(pt[1])) {
          lons.push(pt[0]);
          lats.push(pt[1]);
        }
      }
      function extractCoords(geom) {
        if (!geom) return;
        var c = geom.coordinates;
        function walk(arr) {
          if (!Array.isArray(arr)) return;
          if (arr.length >= 2 && typeof arr[0] === 'number') {
            addPoint(arr);
          } else {
            arr.forEach(walk);
          }
        }
        walk(c);
      }

      if (originData && originData.features) {
        originData.features.forEach(function (f) { extractCoords(f.geometry); });
      }
      if (spillGeojson && spillGeojson.features) {
        spillGeojson.features.forEach(function (f) { extractCoords(f.geometry); });
      }
      if (originData && originData.properties && originData.properties.trajectory) {
        originData.properties.trajectory.forEach(function (t) { addPoint(t.coordinates); });
      }

      if (lons.length > 0 && lats.length > 0) {
        var minLon = Math.min.apply(null, lons);
        var maxLon = Math.max.apply(null, lons);
        var minLat = Math.min.apply(null, lats);
        var maxLat = Math.max.apply(null, lats);
        var spanLon = Math.max(maxLon - minLon, 0.08);
        var spanLat = Math.max(maxLat - minLat, 0.06);
        geoBBox = {
          minLon: minLon - spanLon * 0.20,
          maxLon: maxLon + spanLon * 0.20,
          minLat: minLat - spanLat * 0.20,
          maxLat: maxLat + spanLat * 0.20
        };
      }

      // Update centroids
      if (originData && originData.properties && originData.properties.trajectory && originData.properties.trajectory.length > 0) {
        var traj = originData.properties.trajectory;
        Vt = traj[0].coordinates;
        Ee = traj[traj.length - 1].coordinates;
      }
    }

    function Y(e) {
      if (Array.isArray(e) && e.length >= 2) {
        var lon = e[0], lat = e[1];
        if (lon > 50 && lat > 0 && lat < 50) {
          var rx = (lon - geoBBox.minLon) / (geoBBox.maxLon - geoBBox.minLon);
          var ry = (lat - geoBBox.minLat) / (geoBBox.maxLat - geoBBox.minLat);
          rx = Math.max(0.04, Math.min(0.96, rx));
          ry = Math.max(0.04, Math.min(0.96, ry));
          var px = rx * Ce;
          var py = (1.0 - ry) * _e;
          return [Math.round(px * 10) / 10, Math.round(py * 10) / 10];
        }
      }
      var t = e[0], n = e[1];
      var r = (t + oa) / (2 * oa) * Ce;
      var l = (1 - (n + aa) / (2 * aa)) * _e;
      return [Math.round(r * 10) / 10, Math.round(l * 10) / 10];
    }

    function li(e) {
      if (!Array.isArray(e) || e.length === 0) return '';
      return e.map(function (t, n) {
        return (n === 0 ? 'M' : 'L') + ' ' + Y(t)[0] + ' ' + Y(t)[1];
      }).join(' ') + ' Z';
    }

    function liOpen(e) {
      if (!Array.isArray(e) || e.length === 0) return '';
      return e.map(function (t, n) {
        return (n === 0 ? 'M' : 'L') + ' ' + Y(t)[0] + ' ' + Y(t)[1];
      }).join(' ');
    }

    function getVesselStateAtTime(vessel, tHours) {
      var wps = vessel.waypoints;
      if (tHours <= wps[0].t) {
        var p0 = wps[0].pos, p1 = wps[1].pos;
        var heading = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 57.2958;
        return { pos: p0, speed: wps[0].speed, dark: wps[0].dark, status: wps[0].status, heading: heading };
      }
      if (tHours >= wps[wps.length - 1].t) {
        var last = wps[wps.length - 1];
        var prev = wps[wps.length - 2];
        var heading = Math.atan2(last.pos[1] - prev.pos[1], last.pos[0] - prev.pos[0]) * 57.2958;
        return { pos: last.pos, speed: last.speed, dark: last.dark, status: last.status, heading: heading };
      }
      for (var i = 0; i < wps.length - 1; i++) {
        if (tHours >= wps[i].t && tHours <= wps[i + 1].t) {
          var segFraction = (tHours - wps[i].t) / (wps[i + 1].t - wps[i].t);
          var x = wps[i].pos[0] + (wps[i + 1].pos[0] - wps[i].pos[0]) * segFraction;
          var y = wps[i].pos[1] + (wps[i + 1].pos[1] - wps[i].pos[1]) * segFraction;
          var spd = wps[i].speed + (wps[i + 1].speed - wps[i].speed) * segFraction;
          var dark = (segFraction < 0.5) ? wps[i].dark : wps[i + 1].dark;
          var status = (segFraction < 0.5) ? wps[i].status : wps[i + 1].status;
          var heading = Math.atan2(wps[i + 1].pos[1] - wps[i].pos[1], wps[i + 1].pos[0] - wps[i].pos[0]) * 57.2958;
          return { pos: [x, y], speed: Math.round(spd * 10) / 10, dark: dark, status: status, heading: heading };
        }
      }
      return { pos: wps[0].pos, speed: wps[0].speed, dark: wps[0].dark, status: wps[0].status, heading: 0 };
    }

    function getSlickStateAtTime(tHours) {
      var curHours = Math.min(36.0, Math.max(0.0, -tHours));
      var alpha = curHours / 36.0;

      if (originData && originData.properties && originData.properties.trajectory && originData.properties.trajectory.length > 0) {
        var traj = originData.properties.trajectory;
        var maxIdx = traj.length - 1;
        var stepDuration = 36.0 / maxIdx;
        var stepPos = curHours / stepDuration;
        var idx = Math.min(maxIdx - 1, Math.floor(stepPos));
        var frac = Math.max(0, Math.min(1, stepPos - idx));

        var p1 = traj[idx].coordinates;
        var p2 = traj[Math.min(idx + 1, maxIdx)].coordinates;
        var curLon = p1[0] + (p2[0] - p1[0]) * frac;
        var curLat = p1[1] + (p2[1] - p1[1]) * frac;

        var scale = 1.0 - 0.72 * alpha;
        var baseArea = (analysisData && analysisData.area_km2) ? parseFloat(analysisData.area_km2) : 11.2;
        var area = (baseArea * scale).toFixed(1);

        return {
          pos: [curLon, curLat],
          scale: scale,
          area: area,
          isOriginPoint: (curHours >= 34.0),
          alpha: alpha
        };
      }

      var dischargeT = -18.0;
      if (tHours >= dischargeT) {
        var a = (tHours - dischargeT) / (0 - dischargeT);
        var cx = Ee[0] + (Vt[0] - Ee[0]) * a + 3.2 * Math.sin(Math.PI * a);
        var cy = Ee[1] + (Vt[1] - Ee[1]) * a - 1.6 * Math.sin(Math.PI * a);
        var s = 0.18 + 0.82 * a;
        return { pos: [cx, cy], scale: s, area: (0.5 + 10.7 * a).toFixed(1), isOriginPoint: false, alpha: 1 - a };
      } else {
        return { pos: Ee, scale: 0.18, area: "0.4", isOriginPoint: true, alpha: 1 };
      }
    }

    function renderSlickAtTime(tHours) {

      var scaledPoly = polyBase.map(function (p) {
        var dx = p[0] - Vt[0];
        var dy = p[1] - Vt[1];
        return [slick.pos[0] + dx * slick.scale, slick.pos[1] + dy * slick.scale];

      var html = '<g>';

        '<circle cx="' + sPt[0] + '" cy="' + sPt[1] + '" r="3" fill="#F59E0B"/>' +
        '<g transform="translate(' + sPt[0] + ' ' + (sPt[1] - Math.max(28, ry + 12)) + ')">' +
        '<rect x="-62" y="-12" width="124" height="24" rx="4" fill="rgba(10,18,30,0.92)" stroke="rgba(245,158,11,0.6)" stroke-width="0.8"/>' +

        '</g></g>';
      sg.innerHTML = html;

      // Drift path vector
      if (dg) {
        var driftHTML = '<g>';
        if (originData && originData.properties && originData.properties.trajectory) {
          var traj = originData.properties.trajectory;
          var trajPts = traj.map(function (t) { return t.coordinates; });
          driftHTML += '<path d="' + liOpen(trajPts) + '" fill="none" stroke="rgba(0,212,255,0.25)" stroke-width="4"/>' +
            '<path d="' + liOpen(trajPts) + '" fill="none" stroke="rgba(0,212,255,0.7)" stroke-width="1.2" stroke-dasharray="5 4"/>';

          traj.forEach(function (tr) {
            var tp = Y(tr.coordinates);
            driftHTML += '<circle cx="' + tp[0] + '" cy="' + tp[1] + '" r="2" fill="rgba(0,212,255,0.6)"/>';
          });
        } else {
          driftHTML += '<line x1="' + detPt[0] + '" y1="' + detPt[1] + '" x2="' + oPt[0] + '" y2="' + oPt[1] + '" stroke="rgba(0,212,255,0.1)" stroke-width="6"/>' +
            '<line x1="' + detPt[0] + '" y1="' + detPt[1] + '" x2="' + oPt[0] + '" y2="' + oPt[1] + '" stroke="rgba(0,212,255,0.35)" stroke-width="1.2" stroke-dasharray="5 4"/>';
        }

        driftHTML += '<line x1="' + oPt[0] + '" y1="' + oPt[1] + '" x2="' + sPt[0] + '" y2="' + sPt[1] + '" stroke="#00E5FF" stroke-width="2"/>';
        driftHTML += '</g>';
        dg.innerHTML = driftHTML;
      }

      // Origin point & Mahalanobis confidence bands
      if (og) {
        var originHTML = '<g>';
        var hasDrawnBands = false;

        if (originData && originData.features) {
          var maxHours = 0;
          originData.features.forEach(function(feat) {
            if (feat.properties && feat.properties.hours_before_detection > maxHours) {
              maxHours = feat.properties.hours_before_detection;
            }
          });
          
          originData.features.forEach(function (feat) {
            var band = feat.properties ? feat.properties.probability_band : null;
            var isOriginPoint = feat.properties && feat.properties.hours_before_detection >= (maxHours - 0.1);
            if (isOriginPoint && (band === 95 || band === 75 || band === 50)) {
              var geom = feat.geometry;
              if (geom && geom.coordinates) {
                var bandCoords = [];
                function extB(c) {
                  if (Array.isArray(c)) {
                    if (c.length >= 2 && typeof c[0] === 'number') bandCoords.push([c[0], c[1]]);
                    else c.forEach(extB);
                  }
                }
                extB(geom.coordinates);
                if (bandCoords.length > 2) {
                  var fillColor = (band === 95) ? 'rgba(255,210,127,0.12)' : (band === 75 ? 'rgba(255,140,0,0.20)' : 'rgba(179,0,0,0.30)');
                  var strokeColor = (band === 95) ? '#ffd27f' : (band === 75 ? '#ff8c00' : '#ef4444');
                  var strokeW = (band === 95) ? '1' : (band === 75 ? '1.3' : '1.6');

                  hasDrawnBands = true;

        originHTML += '<circle cx="' + oPt[0] + '" cy="' + oPt[1] + '" r="3.5" fill="#FBBF24" filter="url(#gl)"/>' +

        og.innerHTML = originHTML;
      }
    }

    function renderVesselsAtTime(tHours) {

    function updateSimulationTime(tHours) {
      timelineTime = Math.max(timelineMin, Math.min(timelineMax, parseFloat(tHours)));
      var slider = $('hindcastSlider');
      if (slider && Math.abs(parseFloat(slider.value) - timelineTime) > 0.05) {
        slider.value = timelineTime;
      }

      var baseMs = new Date("2026-08-13T15:00:00Z").getTime();
      var curMs = baseMs + timelineTime * 3600 * 1000;
      var curD = new Date(curMs);
      var hoursStr = curD.getUTCHours().toString().padStart(2, '0');
      var minsStr = curD.getUTCMinutes().toString().padStart(2, '0');
      var dayStr = curD.getUTCDate().toString().padStart(2, '0');
      var months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

      var timeLabel = $('htCurTime');

      renderSlickAtTime(timelineTime);

      if (btn) btn.textContent = timelineSpeed + 'x';
    }

    var lastPlayTimestamp = null;
    function startTimelineLoop() {
      lastPlayTimestamp = performance.now();
      function playStep(now) {
        if (!timelinePlaying) return;
        var dtSec = (now - lastPlayTimestamp) / 1000;
        lastPlayTimestamp = now;

        var newTime = timelineTime + (2.5 * timelineSpeed) * dtSec;
        if (newTime > timelineMax) {
          newTime = timelineMin;
        }
        updateSimulationTime(newTime);
        timelineAnimId = requestAnimationFrame(playStep);
      }
      timelineAnimId = requestAnimationFrame(playStep);
    }

    function stopTimelineLoop() {
      if (timelineAnimId) {
        cancelAnimationFrame(timelineAnimId);
        timelineAnimId = null;
      }

    function callHindcastAPI() {

          var origLat = (data.origin_lat != null) ? data.origin_lat : (Ee ? Ee[1] : 17.561);

          addLog('03:29Z', '3 probability band snapshots computed (50%, 75%, 95%)');

          var html = '<div class="stat-row">' +
            '<div class="stat-card"><div class="stat-val">36h</div><div class="stat-lbl">Rewind Window</div></div>' +
            '<div class="stat-card"><div class="stat-val">500</div><div class="stat-lbl">MC Particles</div></div>' +

        }, 900);

      }).catch(function (err) {

    function startParticleAnimation() {
      var tg = $('tracerLayer');
      if (!tg) return;

      var tracerConfigs = [
        { t: 0.05, speed: 0.0032 },
        { t: 0.20, speed: 0.0035 },
        { t: 0.35, speed: 0.0030 },
        { t: 0.50, speed: 0.0034 },
        { t: 0.65, speed: 0.0031 },
        { t: 0.80, speed: 0.0036 },
        { t: 0.95, speed: 0.0033 }
      ];

      var html = '';
      for (var i = 0; i < tracerConfigs.length; i++) {
        html += '<g id="tr_' + i + '">' +
          '<circle class="tr-head" r="2.5" fill="#00E5FF" filter="url(#gl)"/>' +
          '<circle class="tr-tail" r="1.4" fill="rgba(0,212,255,0.6)"/>' +
          '</g>';
      }
      tg.innerHTML = html;

      var nodes = [];
      for (var i = 0; i < tracerConfigs.length; i++) {
        nodes.push({
          el: $('tr_' + i),
          t: tracerConfigs[i].t,
          speed: tracerConfigs[i].speed
        });
      }

      function getTrajCoord(frac) {
        if (originData && originData.properties && originData.properties.trajectory && originData.properties.trajectory.length > 1) {
          var traj = originData.properties.trajectory;
          var maxIdx = traj.length - 1;
          var f = Math.max(0, Math.min(1, frac)) * maxIdx;
          var i0 = Math.floor(f);
          var i1 = Math.min(maxIdx, i0 + 1);
          var subFrac = f - i0;
          var c0 = traj[i0].coordinates;
          var c1 = traj[i1].coordinates;
          var lon = c0[0] + (c1[0] - c0[0]) * subFrac;
          var lat = c0[1] + (c1[1] - c0[1]) * subFrac;
          return Y([lon, lat]);
        }
        var sP = Y(Vt), oP = Y(Ee);
        return [sP[0] + (oP[0] - sP[0]) * frac, sP[1] + (oP[1] - sP[1]) * frac];
      }

      function animate() {
        nodes.forEach(function (item) {
          item.t += item.speed;
          if (item.t > 1) item.t = 0;
          var curT = item.t;
          var curPt = getTrajCoord(curT);
          var tailPt = getTrajCoord(Math.max(0, curT - 0.03));
          var cx = curPt[0], cy = curPt[1];
          var tx = tailPt[0], ty = tailPt[1];

          var alpha = Math.sin(curT * Math.PI);
          if (item.el) {
            item.el.style.opacity = (alpha * 0.95).toFixed(2);
            var head = item.el.querySelector('.tr-head');
            if (head) {
              head.setAttribute('cx', cx.toFixed(1));
              head.setAttribute('cy', cy.toFixed(1));
            }
            var tail = item.el.querySelector('.tr-tail');
            if (tail) {
              tail.setAttribute('cx', tx.toFixed(1));
              tail.setAttribute('cy', ty.toFixed(1));
            }
          }
        });
        animFrame = requestAnimationFrame(animate);
      }

      if (animFrame) cancelAnimationFrame(animFrame);
      animate();
    }

    function showVesselCard(v, rank) {

      var formattedScore = (typeof v.score === 'string' && v.score.indexOf('.') !== -1) ? v.score : (typeof v.scoreExact === 'number' ? v.scoreExact.toFixed(3) : parseFloat(v.score).toFixed(3));

    function showVerdict() {
      var c = VESSELS.find(function (v) { return v.culprit; }) || VESSELS[0];
      addLog('03:35Z', 'CASE FILE GENERATED — Lead suspect identified', 'warn');

      function parseFactorData(index, fallbackCode, fallbackDesc, fallbackWt, fallbackObs, fallbackMaxPts) {
        var fObj = (c.factors && c.factors[index]) ? c.factors[index] : null;
        var obs = fObj ? fObj.observation : fallbackObs;
        var contrib = fObj ? fObj.contribution : (fallbackMaxPts + ' pts');
        var wt = fObj ? fObj.weight : fallbackWt;
        if (wt && wt.indexOf('wt') === -1 && wt.indexOf('weight') === -1) {
          wt = wt + ' wt';
        }

        var ptsStr = contrib;
        var fCoeff = '';
        var pMatch = contrib.match(/^(.*?)(?:\s*\((?:F=)?([\d.]+)\))?$/);
        if (pMatch) {
          if (pMatch[1] && pMatch[1].trim()) ptsStr = pMatch[1].trim();
          if (pMatch[2]) fCoeff = 'F = ' + parseFloat(pMatch[2]).toFixed(4);
        }

        var ptsVal = ptsStr;
        var ptsMax = '';
        if (ptsStr.indexOf('/') !== -1) {
          var slashParts = ptsStr.split('/');
          ptsVal = slashParts[0].trim();
          ptsMax = '/ ' + slashParts[1].trim();
        }

        return {
          code: fallbackCode,
          desc: fallbackDesc,
          weight: wt,
          obs: obs,
          ptsVal: ptsVal,
          ptsMax: ptsMax,
          coeff: fCoeff
        };
      }

      var factorsData = [
        parseFactorData(0, 'F_loc', 'Distance to origin', '40% wt', (c.dist ? (typeof c.dist === 'number' ? c.dist.toFixed(3) : c.dist) + ' km (geodesic minimum)' : '0.230 km (geodesic min)'), '40.000'),
        parseFactorData(1, 'F_spd', 'Speed anomaly', '25% wt', 'Slowed 14.5 → 3.1 kn (78.6% drop)', '25.000'),
        parseFactorData(2, 'F_gap', 'AIS evasion', '25% wt', (c.dark ? 'Dark transponder shutdown event' : 'AIS continuous feed'), '25.000'),
        parseFactorData(3, 'F_prof', 'Vessel profile', '10% wt', c.type + ' (risk prior ' + (c.typeRisk === 'high' ? '0.95' : '0.25') + ')', '10.000')
      ];

      var scoreStr = (typeof c.scoreExact === 'number') ? c.scoreExact.toFixed(3) : (typeof c.score === 'number' ? c.score.toFixed(3) : c.score);

      var rowsHtml = '';
      for (var i = 0; i < factorsData.length; i++) {
        var fd = factorsData[i];
        rowsHtml += '<div class="ev-row">' +
          '<div class="ev-col-left">' +
            '<div class="ev-factor-head">' +
              '<div class="ev-dot"></div>' +
              '<span class="ev-code">' + fd.code + '</span>' +
              '<span class="ev-desc">' + fd.desc + '</span>' +
              '<span class="ev-wt-badge">' + fd.weight + '</span>' +
            '</div>' +
            '<div class="ev-obs-text">' + fd.obs + '</div>' +
          '</div>' +
          '<div class="ev-col-right">' +
            '<div class="ev-pts-box">' +
              '<span class="ev-pts-val">' + fd.ptsVal + '</span>' +
              (fd.ptsMax ? ' <span class="ev-pts-max">' + fd.ptsMax + '</span>' : '') +
            '</div>' +
            (fd.coeff ? '<div class="ev-coeff-val">' + fd.coeff + '</div>' : '') +
          '</div>' +
        '</div>';
      }

      var html = '<div class="evidence-card">' +
        '<div class="ev-title">' +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>' +
          'Lead Suspect — Vessel Suspicion Index (VSI)' +
        '</div>' +
        '<div class="ev-suspect-name">' + c.name + '</div>' +
        '<div class="ev-imo">IMO ' + c.imo + ' &middot; ' + c.type + '</div>' +
        '<div class="ev-table-header">' +
          '<span>EVIDENCE FACTOR &amp; OBSERVATION</span>' +
          '<span class="ev-th-right">CONTRIBUTION</span>' +
        '</div>' +
        '<div class="ev-rows">' +
          rowsHtml +
        '</div>' +
        '<div class="vsi-total">' +
          '<div class="vsi-total-meta">' +
            '<div class="vsi-lbl">COMPOSITE SUSPICION INDEX</div>' +
            '<div class="vsi-formula">VSI = 100 &times; [0.40&middot;F<sub>loc</sub> + 0.25&middot;F<sub>spd</sub> + 0.25&middot;F<sub>gap</sub> + 0.10&middot;F<sub>prof</sub>]</div>' +
          '</div>' +
          '<div class="vsi-total-score-box">' +
            '<div class="vsi-badge">HIGH SUSPICION</div>' +
            '<div class="vsi-score">' +
              scoreStr +
              '<span class="vsi-score-denom">/ 100</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '</div>' +
        '<div class="enf-note">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="1.6" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
        'Case file exported to Indian Coast Guard. Probabilistic — human verification required per §56 OCEAN PRD. Recommend interdiction at next port of call.' +
        '</div>';
      $('panelBody').innerHTML += html;

      // Generate Dossier button
      $('panelBody').innerHTML +=
        '<button class="btn-dossier" onclick="generateDossier()">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
        '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
        '<polyline points="14 2 14 8 20 8"/>' +
        '<line x1="16" y1="13" x2="8" y2="13"/>' +
        '<line x1="16" y1="17" x2="8" y2="17"/>' +
        '</svg>' +
        'Generate Enforcement Dossier' +
        '</button>';

      var pb = $('panelBody');
      if (pb) pb.scrollTop = pb.scrollHeight;
    }

    function generateDossier() {
      var btn = document.querySelector('.btn-dossier');
      if (!btn) return;
      var panel = $('panelBody');
      if (!panel) return;

      var originalHtml = btn.innerHTML;
      var attribution = {
        timeline_hours: timelineTime,
        vessels: VESSELS.map(function (v, index) {
          var timelineVessel = TIMELINE_VESSELS.find(function (item) { return item.id === v.id; });
          var state = timelineVessel ? getVesselStateAtTime(timelineVessel, timelineTime) : null;
          return {
            rank: index + 1,
            name: v.name,
            imo: v.imo,
            type: v.type,
            dist: v.dist,
            speed_behavior: state ? state.status : 'Not available',
            ais_status: state ? (state.dark ? 'AIS DARK (EVASION)' : 'AIS ACTIVE') : 'Not available',
            score: v.score,
            risk: v.typeRisk,
            culprit: Boolean(v.culprit)
          };
        })
      };
      var lead = VESSELS.find(function (v) { return v.culprit; }) || VESSELS[0];
      if (lead) {
        attribution.lead_suspect = {
          name: lead.name,
          imo: lead.imo,
          type: lead.type,
          score: lead.score,
          factors: (lead.factors && lead.factors.length === 4) ? lead.factors : [
            { factor: 'F_loc — Distance to origin', observation: lead.dist + ' km', weight: '40%', contribution: (lead.f_loc ? (lead.f_loc * 40).toFixed(1) + ' / 40 pts' : '38.4 / 40 pts') },
            { factor: 'F_spd — Speed anomaly', observation: 'Slowed 14.5 → 3.1 kn', weight: '25%', contribution: (lead.f_spd ? (lead.f_spd * 25).toFixed(1) + ' / 25 pts' : '21.5 / 25 pts') },
            { factor: 'F_gap — AIS evasion', observation: 'Dark transponder shutdown event', weight: '25%', contribution: (lead.f_gap ? (lead.f_gap * 25).toFixed(1) + ' / 25 pts' : '25.0 / 25 pts') },
            { factor: 'F_prof — Vessel profile', observation: lead.type + ' (risk prior 0.95)', weight: '10%', contribution: (lead.f_prof ? (lead.f_prof * 10).toFixed(1) + ' / 10 pts' : '9.5 / 10 pts') }
          ]
        };
      }

      btn.disabled = true;
      btn.innerHTML =
        '<div class="loader-spinner" style="width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin-loader .8s linear infinite"></div>' +
        'Generating Enforcement Dossier...';
      addLog('DOSSIER', 'Generating enforcement dossier...', 'info');

      fetch('/api/generate-dossier', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attribution: attribution })
      }).then(function (response) {
        return response.json().then(function (data) {
          if (!response.ok || !data.success) {
            throw new Error(data.error || 'Dossier generation failed.');
          }
          return data;
        });
      }).then(function (data) {
        var currentBtn = panel.querySelector('.btn-dossier') || btn;
        currentBtn.innerHTML =
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
          '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>' +
          '<polyline points="22 4 12 14.01 9 11.01"/>' +
          '</svg>Dossier Generated';
        currentBtn.style.background = 'linear-gradient(135deg, var(--green) 0%, #2DD4BF 100%)';
        var existingLink = panel.querySelector('.dossier-download-link');
        if (existingLink) existingLink.remove();
        var link = document.createElement('a');
        link.className = 'dossier-download-link';
        link.href = data.download_url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'Open ' + data.filename;
        link.style.cssText = 'display:block;margin-top:8px;color:var(--cyan);font-size:.68rem;text-decoration:underline;word-break:break-word';
        addLog('DOSSIER', 'Enforcement dossier generated — ' + data.filename, 'good');
        panel.appendChild(link);
      }).catch(function (error) {
        var currentBtn = panel.querySelector('.btn-dossier');
        if (currentBtn) {
          currentBtn.innerHTML = originalHtml;
          currentBtn.disabled = false;
        }
        addLog('DOSSIER', error.message, 'err');
      });
    }

    /* ═══ Log Helpers ═══ */
    function logHTML(time, msg, cls) {
      return '<div class="log-line"><span class="log-time">' + time + '</span><span class="log-msg' + (cls ? ' ' + cls : '') + '">' + msg + '</span></div>';
    }
    function addLog(time, msg, cls) {
      var p = $('panelBody');
      if (!p) return;
      p.innerHTML += logHTML(time, msg, cls);
      p.scrollTop = p.scrollHeight;
    }

    /* ═══ Init ═══ */
    render();
  </script>
</body>

</html>
